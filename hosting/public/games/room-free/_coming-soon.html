<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}} — LinkUp</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Cairo,system-ui,sans-serif;background:#0b0618;color:#fff;text-align:center;padding:24px}
    .card{max-width:360px;padding:28px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(168,85,247,.35)}
    .emoji{font-size:3rem;margin-bottom:12px}
    h1{font-size:1.2rem;margin:0 0 8px}
    p{opacity:.8;line-height:1.6;font-size:.9rem}
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">{{EMOJI}}</div>
    <h1>{{TITLE}}</h1>
    <p>قريباً — نُجهّز اللعبة بنفس سيناريو الروم المجاني (دعوة + شات + متعدد اللاعبين).</p>
  </div>
</body>
</html>

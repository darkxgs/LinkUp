<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>جاكارو — LinkUp</title>
  <link rel="stylesheet" href="../shared/linkup-game-ui.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="../shared/linkup-room-boot.js"></script>
  <script src="../shared/linkup-audio.js"></script>
</head>
<body class="linkup-game">
  <div class="bg-glow"></div>
  <div class="shell">
    <header class="game-header">
      <h1>🃏 جاكارو</h1>
      <p class="sub">أوراق الشدة — 3 للأمام و4 للخلف — 4 لاعبين</p>
    </header>

    <section id="lobby" class="panel lobby-form">
      <input id="name" type="text" maxlength="16" placeholder="اسمك" />
      <input id="code" type="text" maxlength="8" placeholder="رمز الغرفة" />
      <button id="join" class="btn" type="button">انضم</button>
      <div id="lobby-info" class="hidden">
        <p>الغرفة: <span id="room-code" class="code-pill"></span></p>
        <ul id="players" class="players-list"></ul>
        <button id="ready" class="btn secondary" type="button">جاهز</button>
      </div>
    </section>

    <section id="game" class="hidden">
      <div id="status" class="status-bar"></div>
      <div id="track" class="track"></div>
      <div id="hand" class="hand-cards"></div>
      <div id="winner" class="winner hidden"></div>
    </section>
  </div>
  <script src="app.js" type="module"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#041d13" />
  <title>Penalty Kick — Casino</title>
  <link rel="stylesheet" href="style.css?v=20260622e" />
</head>
<body>
  <div id="app">
    <!-- All screens live here; render.js shows/hides them based on state. -->

    <!-- ===================== WAGER SCREEN ===================== -->
    <section id="screen-wager" class="screen">
      <header class="title-bar">
        <h1 class="logo">⚽ PENALTY <span>KICK</span></h1>
        <p class="tagline">Pass &amp; Play · Best of 5</p>
      </header>

      <div class="wager-grid">
        <div class="player-card" data-player="P1">
          <div class="avatar avatar-p1">P1</div>
          <input class="name-input" data-player="P1" maxlength="12" value="Player 1" />
          <div class="balance-line">Balance: <span class="balance" data-player="P1">0</span></div>
          <button class="ready-toggle" data-player="P1">Ready</button>
        </div>

        <div class="wager-center">
          <div class="vs">VS</div>
          <div class="bet-block">
            <label>Wager (each)</label>
            <div class="chips">
              <button class="chip" data-amount="50">50</button>
              <button class="chip" data-amount="100">100</button>
              <button class="chip" data-amount="250">250</button>
              <button class="chip" data-amount="500">500</button>
            </div>
            <input id="bet-input" type="number" min="1" step="10" value="100" />
            <div class="pot-preview">Pot: <span id="pot-preview">200</span></div>
          </div>
        </div>

        <div class="player-card" data-player="P2">
          <div class="avatar avatar-p2">P2</div>
          <input class="name-input" data-player="P2" maxlength="12" value="Player 2" />
          <div class="balance-line">Balance: <span class="balance" data-player="P2">0</span></div>
          <button class="ready-toggle" data-player="P2">Ready</button>
        </div>
      </div>

      <button id="start-match" class="primary-btn" disabled>Start Match</button>
      <p id="wager-error" class="error-text"></p>
    </section>

    <!-- ===================== MATCH SCREEN ===================== -->
    <section id="screen-match" class="screen hidden">
      <!-- HUD -->
      <div class="hud">
        <div class="hud-player" data-player="P1">
          <div class="hud-avatar av-p1" data-hud-avatar="P1">
            <span class="hud-avatar-fallback">P1</span>
          </div>
          <div class="hud-meta">
            <span class="hud-name" data-player="P1">Player 1</span>
            <span class="hud-score" data-player="P1">0/0</span>
            <span class="hud-balance" data-player="P1"><span class="hud-balance-val">0</span> <img class="coin-icon" src="/images/coin-gold.png?v=4" alt="كوين" /></span>
          </div>
        </div>
        <div class="hud-center">
          <div class="pot-display">POT <span id="hud-pot">0</span> <img class="coin-icon" src="/images/coin-gold.png?v=4" alt="كوين" /></div>
          <div id="round-label" class="round-label">Round 1</div>
        </div>
        <div class="hud-player" data-player="P2">
          <div class="hud-meta hud-meta-right">
            <span class="hud-name" data-player="P2">Player 2</span>
            <span class="hud-score" data-player="P2">0/0</span>
            <span class="hud-balance" data-player="P2"><span class="hud-balance-val">0</span> <img class="coin-icon" src="/images/coin-gold.png?v=4" alt="كوين" /></span>
          </div>
          <div class="hud-avatar av-p2" data-hud-avatar="P2">
            <span class="hud-avatar-fallback">P2</span>
          </div>
        </div>
      </div>

      <!-- The goal scene -->
      <div class="stage">
        <div class="stadium">
          <!-- Backdrop layers: stands, crowd glow, spotlights -->
          <div class="stands"></div>
          <div class="crowd"></div>
          <div class="spotlights">
            <span class="beam beam-1"></span>
            <span class="beam beam-2"></span>
            <span class="beam beam-3"></span>
            <span class="beam beam-4"></span>
          </div>
          <div class="floodlight floodlight-l"></div>
          <div class="floodlight floodlight-r"></div>

          <div class="pitch">
            <div class="goal">
              <!-- Net: back panel + side panels give depth -->
              <div class="net net-back"></div>
              <div class="net net-roof"></div>
              <div class="goal-frame">
                <div class="crossbar"></div>
                <div class="post post-left"></div>
                <div class="post post-right"></div>
              </div>

              <!-- Goalkeeper sprite (built from parts; figure animates) -->
              <div id="keeper" class="keeper">
                <div class="keeper-shadow"></div>
                <div class="keeper-figure">
                  <div class="kp-arm kp-arm-l"></div>
                  <div class="kp-arm kp-arm-r"></div>
                  <div class="kp-head"></div>
                  <div class="kp-body"></div>
                  <div class="kp-leg kp-leg-l"></div>
                  <div class="kp-leg kp-leg-r"></div>
                </div>
              </div>

              <!-- 3x3 aiming/diving grid overlay (built by render.js) -->
              <div id="aim-grid" class="aim-grid"></div>
            </div>

            <div class="ground"></div>
            <div class="six-yard"></div>
            <div class="penalty-arc"></div>
            <div class="penalty-spot"></div>

            <!-- Ball sprite + ground shadow + turn ring -->
            <div id="ball-shadow" class="ball-shadow"></div>
            <div id="ball" class="ball"><span class="ball-ring"></span></div>

            <!-- Particle / explosion layer -->
            <div id="fx" class="fx-layer"></div>
          </div>

          <div class="vignette"></div>
        </div>
      </div>

      <!-- Prompt under the goal: tells current picker what to do -->
      <div id="pick-prompt" class="pick-prompt"></div>

      <!-- Handoff overlay -->
      <div id="handoff" class="overlay hidden">
        <div class="overlay-card">
          <div class="handoff-icon">🤝</div>
          <h2 id="handoff-title">Pass the device to</h2>
          <div id="handoff-name" class="handoff-name">Player 2</div>
          <p id="handoff-sub" class="handoff-sub">Don't peek at the previous pick!</p>
          <button id="handoff-ready" class="primary-btn">I'm Ready</button>
        </div>
      </div>

      <!-- Kick result toast -->
      <div id="result-toast" class="result-toast hidden">
        <span id="result-text"></span>
      </div>
    </section>

    <!-- ===================== MATCH OVER OVERLAY ===================== -->
    <section id="screen-over" class="overlay hidden">
      <div class="overlay-card over-card">
        <div id="over-emoji" class="over-emoji">🏆</div>
        <h2 id="over-title">Player 1 Wins!</h2>
        <div id="over-score" class="over-score">3 — 2</div>
        <div id="over-payout" class="over-payout"></div>
        <div class="over-buttons">
          <button id="rematch-btn" class="primary-btn">Rematch</button>
          <button id="menu-btn" class="secondary-btn">Main Menu</button>
        </div>
      </div>
    </section>
  </div>

  <!-- Modules. Order matters: dependencies first, entry point last. -->
  <script src="../challenge-i18n.js?v=2"></script>
  <script src="../challenge-demo-bridge.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/wallet.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/state.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js?v=20260622e"></script>
</body>
</html>

	<div style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%"></div>
          <script>
            $(document).ready(function(){
                     var oMain = new CMain({
                                            money: 100000,
                                            min_bet: 100,
                                            max_bet: 50000,
                                            time_bet: 0,        //TIME TO WAIT FOR A BET IN MILLISECONDS. SET 0 IF YOU DON'T WANT BET LIMIT
                                            time_winner: 1500,  //TIME FOR WINNER SHOWING IN MILLISECONDS    
                                            win_occurrence: 30, //Win occurrence percentage (100 = always win). 
                                                                //SET THIS VALUE TO -1 IF YOU WANT WIN OCCURRENCE STRICTLY RELATED TO PLAYER BET ( SEE DOCUMENTATION)
                                            casino_cash:100000,   //The starting casino cash that is recharged by the money lost by the user
                                            audio_enable_on_startup:false, //ENABLE/DISABLE AUDIO WHEN GAME STARTS 
                                            fullscreen:true, //SET THIS TO FALSE IF YOU DON'T WANT TO SHOW FULLSCREEN BUTTON
                                            check_orientation:false,     //SET TO FALSE IF YOU DON'T WANT TO SHOW ORIENTATION ALERT 
                                            show_credits:false,                     //ENABLE/DISABLE CREDITS BUTTON IN THE MAIN SCREEN
                                            num_hand_before_ads:10                 //NUMBER OF HANDS PLAYED BEFORE AD SHOWN
                                            //
                                            //// THIS FUNCTIONALITY IS ACTIVATED ONLY WITH CTL ARCADE PLUGIN.///////////////////////////
                                            /////////////////// YOU CAN GET IT AT: /////////////////////////////////////////////////////////
                                            // http://codecanyon.net/item/ctl-arcade-wordpress-plugin/13856421 ///////////
                                });

                                  $(oMain).on("recharge", function(evt) {
                            if (s_bDemoMode) {
                                if(s_oGame !== null){
                                    s_oGame.setMoney(100000);
                                }
                            } else {
                                window.db_getUserBalance(function(iMoney) {
                                    if(s_oGame !== null){
                                        s_oGame.setMoney(iMoney);
                                    }
                                });
                            }
                     });
                     
                     $(oMain).on("start_session", function(evt) {
                            if(getParamValue('ctl-arcade') === "true"){
                                parent.__ctlArcadeStartSession();
                            }
                            //...ADD YOUR CODE HERE EVENTUALLY
                     });
                     
                     $(oMain).on("end_session", function(evt) {
                            if(getParamValue('ctl-arcade') === "true"){
                                parent.__ctlArcadeEndSession();
                            }
                            //...ADD YOUR CODE HERE EVENTUALLY
                     });
                     
                     $(oMain).on("bet_placed", function (evt, iTotBet) {
                            if (window.LinkUpRouletteBridge) {
                                LinkUpRouletteBridge.onBetPlaced(iTotBet);
                            }
                     });

                     $(oMain).on("round_result", function (evt, data) {
                            if (window.LinkUpRouletteBridge && LinkUpRouletteBridge.isEmbedded()) {
                                window.db_saveUserBalance(data.credit, data.win, data.stake);
                            }
                     });
                     
                     $(oMain).on("save_score", function(evt,iMoney) {
                            if(getParamValue('ctl-arcade') === "true"){
                                parent.__ctlArcadeSaveScore({score:iMoney});
                            }
                            if (!s_bDemoMode && window.LinkUpRouletteBridge && !LinkUpRouletteBridge.isEmbedded()) {
                                var iBet = (s_oGame && s_oGame.getCurBet) ? s_oGame.getCurBet() : 0;
                                var iWin = (s_oGame && s_oGame.getLastWin) ? s_oGame.getLastWin() : 0;
                                window.db_saveUserBalance(iMoney, iWin, iBet);
                            }
                      });          
                     
                     $(oMain).on("show_interlevel_ad", function(evt) {
                            if(getParamValue('ctl-arcade') === "true"){
                                parent.__ctlArcadeShowInterlevelAD();
                            }
                            //...ADD YOUR CODE HERE EVENTUALLY
                     });
                     
                     $(oMain).on("share_event", function(evt,iMoney) {
                            if(getParamValue('ctl-arcade') === "true"){
                                parent.__ctlArcadeShareEvent({ img:"200x200.jpg",
                                                                title:TEXT_CONGRATULATIONS,
                                                                msg:TEXT_SHARE_1 + iMoney + TEXT_SHARE_2,
                                                                msg_share:TEXT_SHARE_3 + iMoney + TEXT_SHARE_4
                                                            });
                            }
                            //...ADD YOUR CODE HERE EVENTUALLY
                     });
                     
                     if(isIOS()){
                         setTimeout(function(){sizeHandler();},200);
                     }else{
                         sizeHandler();
                     }
           });

        </script>
